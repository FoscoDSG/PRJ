name: CI

on:
  push:
    branches:
      - cursor/ieol-v1-67a8
      - main
  pull_request:
    branches:
      - cursor/ieol-v1-67a8
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ieol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ieol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/ieol_test
      TEST_DATABASE_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/ieol_test
      IEOL_SESSION_SECRET: ci-test-session-secret
      IEOL_SEED_ADMIN_PASSWORD: ci-test-admin-password
      IEOL_SEED_MAPPER_PASSWORD: ci-test-mapper-password
      IEOL_SEED_OPERATOR_PASSWORD: ci-test-operator-password
      IEOL_SEED_APPROVER_PASSWORD: ci-test-approver-password
      IEOL_INSECURE_COOKIES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Migrate test database
        run: ieol migrate
      - name: Pytest
        run: pytest
      - name: pip-audit
        run: pip-audit
