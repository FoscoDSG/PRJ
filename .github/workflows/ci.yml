name: CI

on:
  push:
    branches:
      - cursor/ieol-v1-67a8
      - main
  pull_request:
    branches:
      - cursor/ieol-v1-67a8
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ieol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ieol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/ieol_test
      TEST_DATABASE_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/ieol_test
      IEOL_APP_DATABASE_URL: postgresql://ieol_app:ieol-app-test-password@127.0.0.1:5432/ieol_test
      IEOL_PII_DATABASE_URL: postgresql://ieol_pii:ieol-pii-test-password@127.0.0.1:5432/ieol_test
      IEOL_EVIDENCE_HMAC_KEY: ci-test-hmac-key
      IEOL_SESSION_SECRET: ci-test-session-secret
      IEOL_SEED_ADMIN_PASSWORD: ci-test-admin-password
      IEOL_SEED_MAPPER_PASSWORD: ci-test-mapper-password
      IEOL_SEED_OPERATOR_PASSWORD: ci-test-operator-password
      IEOL_SEED_APPROVER_PASSWORD: ci-test-approver-password
      IEOL_INSECURE_COOKIES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Migrate test database
        run: ieol migrate
      - name: App role logs in as ieol_app
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg import sql
          from services.db import app_connect
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as owner:
              owner.execute(
                  sql.SQL("ALTER ROLE ieol_app WITH LOGIN PASSWORD {}").format(
                      sql.Literal("ieol-app-test-password")
                  )
              )
              owner.execute("GRANT CONNECT ON DATABASE ieol_test TO ieol_app")
              owner.execute(
                  sql.SQL("ALTER ROLE ieol_pii WITH LOGIN PASSWORD {}").format(
                      sql.Literal("ieol-pii-test-password")
                  )
              )
              owner.execute("GRANT CONNECT ON DATABASE ieol_test TO ieol_pii")
          with app_connect() as conn:
              conn.execute("RESET ROLE")
              row = conn.execute(
                  "SELECT session_user AS session_user, current_user AS current_user"
              ).fetchone()
              if row["session_user"] != "ieol_app" or row["current_user"] != "ieol_app":
                  raise SystemExit(str(row))
              try:
                  conn.execute("UPDATE app.audit_log SET actor = 'x'")
              except psycopg.errors.InsufficientPrivilege:
                  conn.rollback()
              else:
                  raise SystemExit("RESET ROLE ha concesso un update sull'audit")
              try:
                  conn.execute("SELECT value_cleartext FROM app.facts")
              except psycopg.errors.InsufficientPrivilege:
                  conn.rollback()
              else:
                  raise SystemExit("ieol_app legge il chiaro dei dati personali")
          from services.db import pii_connect
          with pii_connect() as pii:
              pii.execute("SELECT value_cleartext FROM app.facts")
              pii.rollback()
          PY
      - name: Pytest
        run: pytest
      - name: pip-audit
        run: pip-audit
