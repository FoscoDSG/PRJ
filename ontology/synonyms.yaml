  - {target_type: OrderLine, target_property: shortage, reason: "Proprietà calcolata, assente negli export ammessi."}
  - {target_type: OrderLine, target_property: source_key, reason: "Il tracciato Danea e i campi Odoo/HubSpot non hanno un id di riga distinto da codice e numero."}
