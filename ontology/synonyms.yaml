# Sinonimi di intestazione per il mapping.
# I numeri sono punteggi di regola, non probabilità e non una calibrazione.
# Fonti usate per scrivere le voci: Odoo 17 (res_partner.xlsx, product_template.xls,
# product_purchase.xls), HubSpot (contacts, companies, deals), Danea Easyfatt
# (tracciato XML ordini). Shopify e FatturaPA 1.2.2 non compaiono qui.
version: "1"
rule: mapping.synonym@v1
score_kind: "punteggio di regola, non probabilità"
sources:
  - id: odoo17_res_partner
    file: res_partner.xlsx
    note: "Campi res.partner di Odoo 17 (nome tecnico o etichetta)."
  - id: odoo17_product_template
    file: product_template.xls
    note: "Campi product.template di Odoo 17, inclusi qty_available e virtual_available."
  - id: odoo17_product_purchase
    file: product_purchase.xls
    note: "Campi product.supplierinfo di Odoo 17 (scheda acquisto del prodotto)."
  - id: hubspot_contacts
    note: "Proprietà predefinite dei contatti HubSpot."
  - id: hubspot_companies
    note: "Proprietà predefinite delle aziende HubSpot."
  - id: hubspot_deals
    note: "Proprietà predefinite delle trattative HubSpot."
  - id: danea_easyfatt_ordini
    note: "Tag del tracciato Easyfatt-Xml documenti (ordini) e il nome italiano indicato da Danea accanto al tag."
