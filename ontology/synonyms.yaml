  - {target_type: Document, target_property: title, reason: "Nessuna colonna nelle fonti ammesse. Resta il ripiego unknown_header."}
  - {target_type: Asset, target_property: name, reason: "Il nome è Product.name. Asset.name non ha una colonna distinta."}
  - {target_type: Transaction, target_property: amount, reason: "L'importo esportato è Order.amount (amount di HubSpot, TotalWithoutTax di Danea)."}
  - {target_type: Order, target_property: margin, reason: "Proprietà calcolata, assente negli export ammessi."}
