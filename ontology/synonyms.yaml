  - {target_type: StockPosition, target_property: source_key, reason: "La chiave di giacenza è composta da prodotto e magazzino, non è una colonna delle fonti."}
  - {target_type: StockPosition, target_property: warehouse_source_key, reason: "Warehouse di Danea è il nome del magazzino (Warehouse.name). Il profilo italiano usa già magazzino."}
  - {target_type: Warehouse, target_property: source_key, reason: "Warehouse di Danea è il nome, non un codice separato."}
  - {target_type: Shipment, target_property: status, reason: "Il tracciato Danea non ha uno stato spedizione distinto dalla causale."}
