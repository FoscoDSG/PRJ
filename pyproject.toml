[project]
name = "ieol"
version = "0.1.0"
description = "Intelligent Enterprise Operating Layer, V1 order management."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "jsonschema>=4.23",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ieol = "apps.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ontology*", "services*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
